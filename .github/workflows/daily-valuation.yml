name: Daily valuation (heavy)

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-valuation
  cancel-in-progress: false

jobs:
  value:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch data
        run: python fetch_data.py --skip-deltas

      - name: Compute cache date
        id: cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache BTC price paths
        id: cache-paths
        uses: actions/cache@v4
        with:
          path: |
            output/btc_price_paths_scenarios_price_paths.npy
            output/btc_price_paths_scenarios_metadata.npz
          # Dated key: paths regenerate at least once per UTC day (fresh starting
          # BTC price), while re-runs within the same day still hit the cache.
          key: btc-paths-v1-${{ steps.cache-date.outputs.date }}-${{ hashFiles('btc_price_paths.py') }}

      - name: Ensure BTC price paths
        run: |
          if [ ! -f output/btc_price_paths_scenarios_price_paths.npy ]; then
            python btc_price_paths.py
          else
            echo "Price paths restored from cache"
          fi

      - name: SATA valuation (baseline)
        run: python sata_valuation.py --baseline-only

      # STRC valuation is intentionally not run: the model assumes STRC has
      # sole claim on MSTR's entire consolidated treasury, ignoring senior
      # convertible debt and the other preferred series that also draw on it.
      # export_site_data.py already handles a missing strc_valuation_results.json
      # gracefully (STRC renders as "pending" on the site).

      - name: Export site JSON
        run: python export_site_data.py

      - name: Commit data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/ yield_curve_fallback.json mstr_treasury_fallback.json || true
          if git diff --staged --quiet; then
            echo "No fair_values / market changes"
          else
            # main moves under this job (this workflow's own overlapping runs,
            # market-snapshot.yml, or a manual push) — retry against the
            # latest tip instead of failing the whole job on a push race.
            for i in 1 2 3 4 5; do
              git commit -m "chore: refresh fair_values and market snapshot"
              if git push; then
                echo "Pushed successfully"
                break
              fi
              echo "Push rejected (attempt $i/5) — retrying against latest main..."
              git fetch origin main
              git reset --soft origin/main
              if [ "$i" = "5" ]; then
                echo "::error::Failed to push after 5 attempts"
                exit 1
              fi
            done
          fi
